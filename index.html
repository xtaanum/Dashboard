<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <nav class="navbar">
      <a href="#" class="logo">TaskFlow</a>

      <div class="nav-links">
        <a href="#dashboard">Dashboard</a>
        <a href="#tasks">Tasks</a>
        <a href="#create-task">Create Task</a>
      </div>
    </nav>
  </header>


  <main class="container" id="dashboard">

  
    <section class="page-header">
      <div>
        <p class="eyebrow">Task Management</p>
        <h1>Task Dashboard</h1>
        <p>Manage and track your tasks in one place.</p>
      </div>

      <button class="primary-btn" id="newTaskBtn">
        + New Task
      </button>
    </section>

    <section class="summary-grid">

      <article class="summary-card">
        <span>Total Tasks</span>
        <strong id="totalTasks">0</strong>
      </article>

      <article class="summary-card">
        <span>Completed</span>
        <strong id="completedTasks">0</strong>
      </article>

      <article class="summary-card">
        <span>Pending</span>
        <strong id="pendingTasks">0</strong>
      </article>

      <article class="summary-card">
        <span>Completion Rate</span>
        <strong id="completionRate">0%</strong>
      </article>

    </section>

    <section class="task-form-section" id="create-task">

      <div class="section-heading">
        <div>
          <p class="eyebrow">Create</p>
          <h2>Add a New Task</h2>
        </div>
      </div>

      <form id="taskForm">

        <div class="form-group">
          <label for="taskTitle">Task title</label>

          <input
            type="text"
            id="taskTitle"
            placeholder="e.g. Complete API assignment"
          >

          <small id="titleError" class="form-error"></small>
        </div>

        <div class="form-group">
          <label for="taskStatus">Status</label>

          <select id="taskStatus">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="submitBtn"
        >
          Add Task
        </button>

      </form>

    </section>


    <!-- Tasks -->
    <section class="tasks-section" id="tasks">

      <div class="section-heading">
        <div>
          <p class="eyebrow">Overview</p>
          <h2>Your Tasks</h2>
        </div>
      </div>


      
      <div class="task-controls">

        <div class="search-wrapper">
          <label for="searchInput">Search tasks</label>

          <input
            type="search"
            id="searchInput"
            placeholder="Search by task title..."
          >
        </div>


        <div class="filter-buttons">

          <button
            class="filter-btn active"
            data-filter="all"
          >
            All
          </button>

          <button
            class="filter-btn"
            data-filter="pending"
          >
            Pending
          </button>

          <button
            class="filter-btn"
            data-filter="completed"
          >
            Completed
          </button>

        </div>

      </div>


    
      <div id="statusMessage" class="status-message"></div>

      <div id="taskList" class="task-grid"></div>

    </section>
    
    <section
      id="taskDetails"
      class="task-details hidden"
    ></section>

  </main>


  <footer class="footer">
    <p>TaskFlow &copy; 2026</p>
  </footer>


  <script type="module" src="app.js"></script>

</body>
</html>
